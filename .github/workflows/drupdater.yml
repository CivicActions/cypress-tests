name: Drupadater

on:
  #  schedule:
  #    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Building site and running Drupdater
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Docker images.
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}

      - uses: php-actions/composer@v6
        with:
          php_version: '8.4'
          php_extensions: gd

      - name: Install ddev.
        run: |
          curl -fsSL https://apt.fury.io/drud/gpg.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/ddev.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/ddev.gpg] https://apt.fury.io/drud/ * *" | sudo tee /etc/apt/sources.list.d/ddev.list
          sudo apt update && sudo apt install -y ddev

      - name: Setup Drupal website.
        run: ./scripts/setup.sh

      - name: Run Drupdater.
        run: docker run -v "$(pwd)":/app -w /app ghcr.io/drupdater/drupdater-php8.4:latest --dry-run --verbose --report /app/drupdater-report.json

      - name: Archive Drupdater results.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drupdater-report.json
          path: drupdater-report.json
          retention-days: 2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
